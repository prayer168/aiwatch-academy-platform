project_id = "aiwatch-academy-platform-local"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "請驗證你的 AI Watch Academy 電子郵件"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "重設你的 AI Watch Academy 密碼"
content_path = "./supabase/templates/recovery.html"
